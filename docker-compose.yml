services:
  # Core Infrastructure Services
  
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: logforwarder-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logforwarder}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logforwarder}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-logforwarder}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9004:9004"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./middleware/docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./middleware/docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./middleware/docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logforwarder-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: logforwarder-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic_password}
      - logger.level=info
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./middleware/docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logforwarder-network

  redis:
    image: redis:7-alpine
    container_name: logforwarder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logforwarder-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: logforwarder-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - logforwarder-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: logforwarder-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - logforwarder-network

  tabix:
    image: spoonest/clickhouse-tabix-web-client:stable
    container_name: logforwarder-tabix
    ports:
      - "8124:80"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - logforwarder-network
    restart: unless-stopped

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: logforwarder-middleware
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DB:-logforwarder}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logforwarder}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-logforwarder}
      ELASTICSEARCH_URI: http://elasticsearch:9200
      ELASTICSEARCH_USER: ${ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-elastic_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-in-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - logforwarder-network
    restart: unless-stopped

  logforwarder:
    build:
      context: .
      dockerfile: Dockerfile.logforwarder
    container_name: logforwarder-forwarder
    environment:
      RUST_LOG: info
      LOGFORWARDER_ID: ${LOGFORWARDER_ID:-docker-forwarder}
    ports:
      - "9090:9090"
    volumes:
      - ./LogForwarder/config:/app/config:ro
      - ./LogForwarder/var:/app/var
      - ./LogForwarder/test:/app/test
    depends_on:
      middleware:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - logforwarder-network
    restart: unless-stopped

  ui:
    image: node:22-alpine
    container_name: logforwarder-ui
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "3000:5173"
    volumes:
      - ./ui:/app
      - /app/node_modules
    depends_on:
      middleware:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - logforwarder-network
    restart: unless-stopped

volumes:
  clickhouse_data:
  clickhouse_logs:
  elasticsearch_data:
  redis_data:
  kafka_data:

networks:
  logforwarder-network:
    driver: bridge
