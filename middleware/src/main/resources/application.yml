spring:
  application:
    name: logforwarder-middleware
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration

  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 10000
        allow-core-thread-timeout: true
        keep-alive: "60s"
      thread-name-prefix: "async-"
      shutdown:
        await-termination: true
        await-termination-period: "60s"
    scheduling:
      pool:
        size: 4
        thread-name-prefix: "scheduler-"
      shutdown:
        await-termination: true
        await-termination-period: "60s"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 1000
          fetch_size: 500
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.MySQLDialect

  datasource:
    clickhouse:
      jdbc-url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/logforwarder}
      username: ${CLICKHOUSE_USER:logforwarder}
      password: ${CLICKHOUSE_PASSWORD:logforwarder}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

    postgresql:
      url: ${POSTGRESQL_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=logforwarder}
      username: ${POSTGRESQL_USER:postgres}
      password: ${POSTGRESQL_PASSWORD:admin}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
    timeout: 10000

  elasticsearch:
    rest:
      uris: ${ELASTICSEARCH_URI:http://localhost:9200}
      connection-timeout: 5000
      socket-timeout: 30000

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: log-forwarder-group
      auto-offset-reset: earliest
      max-poll-records: 500
      session-timeout-ms: 30000
      heartbeat-interval-ms: 10000
      auto-commit-interval-ms: 5000
    producer:
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy
      acks: all
      retries: 3
      request-timeout-ms: 30000
      delivery-timeout-ms: 120000

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: always

management:
  security:
    enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
    elasticsearch:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    #root: INFO
    com.monitoring.logforwarder: DEBUG
    com.monitoring.logforwarder.security: DEBUG
    #org.springframework.web: INFO
    org.springframework.security: DEBUG
    #org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/logforwarder.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
    expiration: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

  api:
    version: v1
    base-path: /api/v1
    rate-limit: 1000
    request-timeout: 30000

  forwarder:
    heartbeat-timeout: 60000
    metrics-retention-days: 30
    max-batch-size: 10000

  elasticsearch:
    index-prefix: logs
    shards: 5
    replicas: 1
    refresh-interval: 1s

  rate-limit:
    enabled: true
    requests-per-minute: 1000
    requests-per-hour: 50000
    endpoints:
      "[/api/v1/events/batch]":
        per-minute: 2000
        per-hour: 100000
      "[/api/v1/events/search]":
        per-minute: 500
        per-hour: 25000
      "[/api/v1/forwarders]":
        per-minute: 300
        per-hour: 15000
      "[/api/v1/alerts]":
        per-minute: 200
        per-hour: 10000
      "[/api/v1/users]":
        per-minute: 100
        per-hour: 5000
    forwarder:
      rate-limit:
        enabled: true
        events-per-minute: 10000

  batch:
    event-batch-size: 1000
    event-batch-timeout-ms: 5000
    queue-capacity: 100000
    jdbc-batch-size: 1000
    jdbc-fetch-size: 500

  async:
    thread-pool-size: 16
    queue-size: 10000
    enable-metrics: true
    completable-future-timeout-ms: 30000
    virtual-threads-enabled: true
    virtual-threads-factory: "VirtualThreadPerTaskExecutor"

grpc:
  server:
    port: 50051
