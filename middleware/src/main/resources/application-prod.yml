spring:
  elasticsearch:
    rest:
      uris: ${ELASTICSEARCH_URI:https://elasticsearch:9200}
      username: ${ELASTICSEARCH_USER}
      password: ${ELASTICSEARCH_PASSWORD}
      socket-timeout: 30000
      connection-timeout: 5000

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 10000
    ssl: true

  datasource:
    clickhouse:
      jdbc-url: ${DATABASE_URL}
      username: ${CLICKHOUSE_USER}
      password: ${CLICKHOUSE_PASSWORD}
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: log-forwarder-group
      auto-offset-reset: earliest
    producer:
      batch-size: 16384
      compression-type: snappy
      acks: all
      retries: 3

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 1000
          fetch_size: 500
        order_inserts: true
        order_updates: true

logging:
  level:
    root: WARN
    com.monitoring.logforwarder: INFO
    org.springframework.web: WARN
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  file:
    name: /var/log/logforwarder/middleware.log
    max-size: 10MB
    max-history: 30

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  api:
    version: v1
    base-path: /api/v1
    rate-limit: ${API_RATE_LIMIT:1000}
    request-timeout: ${API_REQUEST_TIMEOUT:30000}

  forwarder:
    heartbeat-timeout: 60000
    metrics-retention-days: ${METRICS_RETENTION_DAYS:30}
    max-batch-size: 10000

  elasticsearch:
    index-prefix: logs
    shards: ${ELASTICSEARCH_SHARDS:5}
    replicas: ${ELASTICSEARCH_REPLICAS:2}
    refresh-interval: 1s

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}}

  security:
    enforce-https: true
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    require-ssl: true
    secure-cookies: true

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:1000}
    requests-per-hour: ${RATE_LIMIT_PER_HOUR:50000}

  batch:
    event-batch-size: 1000
    event-batch-timeout-ms: 5000
    queue-capacity: 100000
    jdbc-batch-size: 1000
    jdbc-fetch-size: 500

  async:
    thread-pool-size: 32
    queue-size: 50000
    completable-future-timeout-ms: 60000

  task:
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 50000

server:
  port: 8080
  ssl:
    enabled: true
    key-store: ${SERVER_SSL_KEY_STORE:/etc/pki/logforwarder/keystore.jks}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
    key-store-type: JKS
    key-alias: logforwarder
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    shutdown:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

validation:
  startup:
    validate-clickhouse: true
    validate-elasticsearch: true
    validate-redis: true
    validate-mongodb: ${VALIDATE_MONGODB:false}
    fail-on-missing-secrets: true
