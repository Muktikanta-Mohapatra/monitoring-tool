spring:
  elasticsearch:
    rest:
      uris: ${ELASTICSEARCH_URI:http://localhost:9200}
      username: ${ELASTICSEARCH_USER:elastic}
      password: ${ELASTICSEARCH_PASSWORD:elastic_password}
      socket-timeout: 30000
      connection-timeout: 5000

  # MongoDB is not used - disabled
  # data:
  #   mongodb:
  #     uri: ${MONGODB_URI:mongodb://localhost:27017/logforwarder}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis_password}
    timeout: 10000

  datasource:
    clickhouse:
      jdbc-url: ${DATABASE_URL:jdbc:clickhouse://localhost:8123/logforwarder?jdbcCompliant=false}
      username: ${CLICKHOUSE_USER:logforwarder}
      password: ${CLICKHOUSE_PASSWORD:logforwarder}
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: log-forwarder-group
      auto-offset-reset: earliest
    producer:
      batch-size: 16384
      compression-type: snappy

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.monitoring.logforwarder: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev-insecure-secret-change-in-production}
    expiration: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  api:
    version: v1
    base-path: /api/v1
    rate-limit: 1000
    request-timeout: 30000

  forwarder:
    heartbeat-timeout: 60000
    metrics-retention-days: 30
    max-batch-size: 10000

  elasticsearch:
    index-prefix: logs
    shards: 1
    replicas: 0
    refresh-interval: 1s

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}

  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}

  security:
    enforce-https: false
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:1000}
    requests-per-hour: ${RATE_LIMIT_PER_HOUR:50000}

  batch:
    event-batch-size: 1000
    event-batch-timeout-ms: 5000
    queue-capacity: 100000
    jdbc-batch-size: 1000
    jdbc-fetch-size: 500

  async:
    thread-pool-size: 8
    queue-size: 5000
    completable-future-timeout-ms: 30000

  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 5000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env
  endpoint:
    health:
      show-details: when-authorized
