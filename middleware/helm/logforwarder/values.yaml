replicaCount: 3

image:
  registry: docker.io
  repository: logforwarder/middleware
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1
          pathType: Prefix
  tls:
    - secretName: logforwarder-tls
      hosts:
        - api.example.com

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector:
  node-type: app

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - logforwarder-middleware
          topologyKey: kubernetes.io/hostname

tolerations: []

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/startup
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

env:
  SPRING_PROFILES_ACTIVE: "prod"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_MONITORING: "DEBUG"
  JAVA_OPTS: "-Xms512m -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

config:
  elasticsearch:
    uri: "https://elasticsearch.logforwarder.svc.cluster.local:9200"
    username: "elastic"
  redis:
    host: "redis-cluster.logforwarder.svc.cluster.local"
    port: 6379
  kafka:
    bootstrapServers: "kafka-0.kafka-headless.logforwarder.svc.cluster.local:9092,kafka-1.kafka-headless.logforwarder.svc.cluster.local:9092,kafka-2.kafka-headless.logforwarder.svc.cluster.local:9092"
  websocket:
    allowedOrigins: "https://app.example.com,https://www.example.com"
  batch:
    eventBatchSize: 100
    eventBatchTimeoutMs: 5000
    elasticsearchBatchSize: 500
  scheduler:
    metricsAggregationInterval: 300000
    batchFlushInterval: 10000
  dataRetention:
    eventRetentionDays: 365
    auditLogRetentionDays: 90
    metricsRetentionDays: 30
  rateLimit:
    enabled: true
    requestsPerMinute: 1000
    requestsPerHour: 50000

secrets:
  database:
    url: "jdbc:clickhouse://clickhouse.logforwarder.svc.cluster.local:8123/logforwarder"
    username: "logforwarder"
    password: "CHANGE_ME"
  elasticsearch:
    password: "CHANGE_ME"
  redis:
    password: "CHANGE_ME"
  jwt:
    secret: "CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG"

clickhouse:
  enabled: false
  auth:
    username: logforwarder
    password: "CHANGE_ME"
    database: logforwarder

elasticsearch:
  enabled: false
  auth:
    enabled: true
    username: elastic
    password: "CHANGE_ME"

redis:
  enabled: false
  auth:
    enabled: true
    password: "CHANGE_ME"

kafka:
  enabled: false
  replicaCount: 3

volumeMounts:
  - name: config
    mountPath: /app/config
    readOnly: true
  - name: logs
    mountPath: /app/logs

volumes:
  - name: config
    configMap:
      name: logforwarder-config
  - name: logs
    emptyDir: {}

terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 2
