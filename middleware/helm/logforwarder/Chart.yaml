apiVersion: v2
name: logforwarder
description: A Helm chart for Log Forwarder Middleware - Splunk-like Log Monitoring System
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/monitoring/logforwarder
sources:
  - https://github.com/monitoring/logforwarder
maintainers:
  - name: Platform Team
    email: platform@example.com
keywords:
  - monitoring
  - logging
  - forwarder
  - elk
  - splunk
  - kubernetes
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: elasticsearch
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "21.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
