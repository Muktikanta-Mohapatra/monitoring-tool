version: '3.9'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: logforwarder-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-logforwarder}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logforwarder}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-logforwarder}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9004:9004"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logforwarder-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: logforwarder-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic_password}
      - logger.level=info
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-elastic_password} https://localhost:9200 --cacert /usr/share/elasticsearch/config/certs/ca.crt >/dev/null || curl -s -u elastic:${ELASTIC_PASSWORD:-elastic_password} http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logforwarder-network

  redis:
    image: redis:7-alpine
    container_name: logforwarder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logforwarder-network

  postgres:
    image: postgres:15-alpine
    container_name: logforwarder-postgres
    environment:
      POSTGRES_DB: ${POSTGRESQL_DB:-logforwarder}
      POSTGRES_USER: ${POSTGRESQL_USER:-logforwarder}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-logforwarder_password}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER:-logforwarder} -d ${POSTGRESQL_DB:-logforwarder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logforwarder-network
    restart: unless-stopped

  tabix:
    image: spoonest/clickhouse-tabix-web-client:stable
    container_name: logforwarder-tabix
    ports:
      - "8124:80"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - logforwarder-network
    restart: unless-stopped

  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logforwarder-middleware
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DB:-logforwarder}
      SPRING_DATASOURCE_USERNAME: ${CLICKHOUSE_USER:-logforwarder}
      SPRING_DATASOURCE_PASSWORD: ${CLICKHOUSE_PASSWORD:-logforwarder_dev_password}
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DB:-logforwarder}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logforwarder}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-logforwarder_dev_password}
      POSTGRESQL_URL: jdbc:postgresql://postgres:5432/${POSTGRESQL_DB:-logforwarder}
      POSTGRESQL_USER: ${POSTGRESQL_USER:-logforwarder}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-logforwarder_password}
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_REST_USERNAME: elastic
      SPRING_ELASTICSEARCH_REST_PASSWORD: ${ELASTIC_PASSWORD:-elastic_password}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-in-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - logforwarder-network
    restart: unless-stopped

volumes:
  clickhouse_data:
  clickhouse_logs:
  elasticsearch_data:
  redis_data:
  postgres_data:

networks:
  logforwarder-network:
    driver: bridge
