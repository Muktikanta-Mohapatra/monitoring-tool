apiVersion: v1
kind: Service
metadata:
  name: logforwarder-middleware
  namespace: logforwarder
  labels:
    app: logforwarder-middleware
  annotations:
    description: "Service for Log Forwarder Middleware API"
spec:
  type: ClusterIP
  selector:
    app: logforwarder-middleware
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: actuator
    port: 8081
    targetPort: 8081
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---
apiVersion: v1
kind: Service
metadata:
  name: logforwarder-middleware-headless
  namespace: logforwarder
  labels:
    app: logforwarder-middleware
  annotations:
    description: "Headless service for Log Forwarder Middleware"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: logforwarder-middleware
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: actuator
    port: 8081
    targetPort: 8081
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: logforwarder-middleware-external
  namespace: logforwarder
  labels:
    app: logforwarder-middleware
  annotations:
    description: "External service for Log Forwarder Middleware"
spec:
  type: LoadBalancer
  selector:
    app: logforwarder-middleware
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  loadBalancerSourceRanges: []
