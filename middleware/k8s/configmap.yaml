apiVersion: v1
kind: ConfigMap
metadata:
  name: logforwarder-config
  namespace: logforwarder
  labels:
    app: logforwarder-middleware
data:
  elasticsearch-uri: "https://elasticsearch.logforwarder.svc.cluster.local:9200"
  redis-host: "redis-cluster.logforwarder.svc.cluster.local"
  redis-port: "6379"
  kafka-bootstrap-servers: "kafka-0.kafka-headless.logforwarder.svc.cluster.local:9092,kafka-1.kafka-headless.logforwarder.svc.cluster.local:9092,kafka-2.kafka-headless.logforwarder.svc.cluster.local:9092"
  websocket-origins: "https://app.example.com,https://www.example.com"
  
  application.yml: |
    spring:
      application:
        name: logforwarder-middleware
      profiles:
        active: prod
      jpa:
        hibernate:
          ddl-auto: none
        properties:
          hibernate:
            format_sql: false
            use_sql_comments: false
      datasource:
        hikari:
          maximum-pool-size: 30
          minimum-idle: 10
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
      elasticsearch:
        rest:
          connection-timeout: 10s
          read-timeout: 30s
      redis:
        timeout: 3000ms
        lettuce:
          pool:
            max-active: 20
            max-idle: 10
            min-idle: 5
            max-wait: -1ms
      kafka:
        producer:
          batch-size: 16384
          linger-ms: 10
          compression-type: snappy
          acks: all
          retries: 3
        consumer:
          auto-offset-reset: earliest
          max-poll-records: 500
          session-timeout-ms: 30000
          heartbeat-interval-ms: 10000
          enable-auto-commit: true
          auto-commit-interval-ms: 5000
    
    server:
      servlet:
        context-path: /
      compression:
        enabled: true
        min-response-size: 1024
        mime-types: application/json,application/xml,text/html,text/xml,text/plain
      error:
        include-message: always
        include-binding-errors: always
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus,threaddump
          base-path: /actuator
      endpoint:
        health:
          show-details: when-authorized
          show-components: when-authorized
        metrics:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
      health:
        livenessState:
          enabled: true
        readinessState:
          enabled: true
    
    logging:
      level:
        root: INFO
        com.monitoring.logforwarder: DEBUG
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    
    app:
      batch:
        event-batch-size: 1000
        event-batch-timeout-ms: 5000
        elasticsearch-batch-size: 500
        queue-capacity: 100000
        jdbc-batch-size: 1000
        jdbc-fetch-size: 500
      scheduler:
        metrics-aggregation-interval: 300000
        metrics-aggregation-initial-delay: 60000
        metrics-hourly-aggregation: 3600000
        metrics-hourly-initial-delay: 120000
        metrics-daily-aggregation: 86400000
        metrics-daily-initial-delay: 180000
        batch-flush-interval: 10000
        index-batch-flush-interval: 15000
        cleanup-events-cron: "0 2 * * *"
        cleanup-audit-logs-cron: "0 3 * * *"
        cleanup-metrics-cron: "0 4 * * *"
        cleanup-elasticsearch-cron: "0 5 1 * *"
      data:
        event-retention-days: 365
        audit-log-retention-days: 90
        metrics-retention-days: 30
      rate-limit:
        enabled: true
        requests-per-minute: 1000
        requests-per-hour: 50000
