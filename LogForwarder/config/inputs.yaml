system:
  metrics:
    bind_address: "0.0.0.0"
    port: 9090
    enabled: true

  queue:
    capacity: 65536
    max_memory_mb: 50

  batch:
    size: 1000
    max_memory_mb: 10
    flush_interval_ms: 1000

  file_watcher:
    delay_ms: 500
    enabled: true

  health_check:
    interval_secs: 30
    error_threshold: 10

  file_input:
    paused_sleep_ms: 500
    throttled_sleep_ms: 500
    normal_sleep_ms: 100

  config_history_path: "var/config_history"
  checkpoint_path: "var/checkpoint"
  event_tx_channel_capacity: 10000
  queue_pop_sleep_ms: 10

format_detection:
  enabled: true
  cache_size: 1000
  confidence_threshold: 0.8
  re_evaluation_interval: 10000
  priority_order: []

parser_fallback:
  enabled: true
  when_unknown: "raw"
  sampling_rate: 1.0

inputs:
  - type: file
    name: test_logs
    path: "test/logs/*.log"
    sourcetype: application
    index: main
    recursive: false
    follow_tail: true
    encoding: utf-8
    batch_size: 100
    read_buffer_kb: 128
    checkpoint_interval_ms: 5000

outputs:
  - name: http_output
    url: "http://localhost:8080/api/v1/events/batch"
    token: ""
    api_key: ""
    forwarder_id: "forwarder-001"
    tls_verify: false
    batch_size: 100
    flush_interval_ms: 5000
    retry_count: 3
    compression_enabled: false
    compression_level: 3
    compression_adaptive: true
    compression_use_dict: false
    protocol: "http"
